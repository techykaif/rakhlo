<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#141512">
    <title>Rakhlo is offline</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: #f7f6f1; color: #141512; }
      main { width: min(560px, calc(100% - 32px)); padding: 32px; border: 1px solid #deddd6; border-radius: 28px; background: #fff; box-shadow: 0 20px 60px rgba(20,21,18,.08); }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: #141512; color: #f7f6f1; font-size: 20px; font-weight: 800; }
      .kicker { margin-top: 24px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: #6f7068; }
      h1 { margin: 10px 0 0; font-size: clamp(34px, 8vw, 52px); line-height: 1; letter-spacing: -.03em; }
      p { margin: 16px 0 0; font-size: 14px; line-height: 1.7; color: #5f6059; }
      a { display: inline-flex; margin-top: 24px; min-height: 44px; align-items: center; justify-content: center; padding: 0 16px; border-radius: 12px; background: #141512; color: #fff; text-decoration: none; font-size: 12px; font-weight: 800; }
      .note { margin-top: 18px; font-size: 11px; color: #6f7068; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">R</div>
      <div class="kicker">Rakhlo offline</div>
      <h1>You’re offline right now.</h1>
      <p>Rakhlo could not reach the service. Your saved purchase drafts stay in this browser and can sync when the connection returns.</p>
      <a href="/">Try again</a>
      <div class="note">No account data is cached by the service worker while you are offline.</div>
    </main>
  </body>
</html>
