name: Rakhlo CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rakhlo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm run test

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

  e2e:
    name: Production E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_TEST_MODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests against the CI production server
        run: npm run test:e2e
